name: base_mobile_app
description: Base Mobile App - A Flutter project with BLoC, Hive, get_it, injectable, equatable, and flavors.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Dependency Injection
  get_it: ^8.2.0
  injectable: ^2.3.0
  
  # Value Equality
  equatable: ^2.0.5
  
  # HTTP Client
  dio: ^5.9.0
  
  # Other utilities
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  injectable_generator: ^2.6.2
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  
  # Linting
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true