# Run command: flutter pub run flutter_native_splash:create
# This project has the following flavors:
# flutter pub run flutter_native_splash:create --flavors prod
flutter_native_splash: #See more: https://pub.dev/packages/flutter_native_splash
  color: "#ffffff"
  color_dark: "#ffffff"
  # image: configs/splash_screen/transparent.png
  fullscreen: true

  android: true
  android_gravity: center #center, fill
  # android_12:
  #   image: configs/splash_screen/transparent.png
  #   image_dark: configs/splash_screen/transparent.png

  ios: true
  ios_content_mode: center #center, scaleAspectFill

  web: true